  <text x="1215" y="488" fill="#94A3B8">&lt;eos&gt;</text>
</g>
<g stroke="#334155" stroke-width="2.4" marker-end="url(#asl)">
  <line x1="255" y1="451" x2="255" y2="406"/><line x1="575" y1="451" x2="575" y2="406"/><line x1="895" y1="451" x2="895" y2="406"/>
</g>
<g font-size="13" fill="#64748B" text-anchor="end">
  <text x="248" y="432">emb [B,64]</text><text x="568" y="432">emb [B,64]</text><text x="888" y="432">emb [B,64]</text>
</g>

<!-- ===== AUTOREGRESSIVE : t → t+1  (ĐÚNG CHIỀU) ===== -->
<g stroke="#15803D" stroke-width="3" fill="none" marker-end="url(#ag)">
  <path d="M352,123 L460,123 L460,482 L521,482"/>
  <path d="M672,123 L780,123 L780,482 L841,482"/>
</g>
<rect x="1352" y="96" width="228" height="58" rx="9" fill="#E8F6EC" stroke="#15803D" stroke-width="1.8"/>
<text x="1466" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#14532D">đường xanh = autoregressive</text>
<text x="1466" y="142" text-anchor="middle" font-size="14" fill="#15803D">y_t trở thành input của bước t+1</text>

<!-- ===== CROSS-ATTENTION BUS ===== -->
<g stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 5" fill="none" marker-end="url(#asl)">
  <path d="M365,385 L395,385 L395,556"/><path d="M685,385 L715,385 L715,556"/><path d="M1005,385 L1035,385 L1035,556"/>
</g>
<g font-size="13" fill="#64748B">
  <text x="400" y="540">q₁</text><text x="720" y="540">q₂</text><text x="1040" y="540">q₃</text>
</g>
<g stroke="#0E7490" stroke-width="2.8" marker-end="url(#at)">
  <line x1="350" y1="556" x2="350" y2="406"/><line x1="670" y1="556" x2="670" y2="406"/><line x1="990" y1="556" x2="990" y2="406"/>
</g>
<g font-size="13" fill="#0E7490" text-anchor="end">
  <text x="344" y="530">c₁ [B,128]</text><text x="664" y="530">c₂ [B,128]</text><text x="984" y="530">c₃ [B,128]</text>
</g>

<rect x="180" y="556" width="1200" height="76" rx="12" fill="#E8F1FD" stroke="#1D4ED8" stroke-width="2.4"/>
<text x="780" y="584" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A8A">Cross-Attention — nét đứt ↑ = query q_t  ·  nét liền ↓ = context c_t</text>
<text x="780" y="614" text-anchor="middle" font-size="16" fill="#334155">c_t = Linear₍₁₉₂→₁₂₈₎ ( [ attn(q_t, K_img, V_img) ; attn(q_t, K_txt, V_txt) ] )  →  [B,128]</text>

<!-- ===== SOURCE PANELS ===== -->
<line x1="570" y1="676" x2="570" y2="636" stroke="#0E7490" stroke-width="3" marker-end="url(#at)"/>
<text x="582" y="662" font-size="15" font-weight="600" fill="#0E7490">K_img , V_img</text>
<line x1="1070" y1="676" x2="1070" y2="636" stroke="#B45309" stroke-width="3" marker-end="url(#aa)"/>
<text x="1082" y="662" font-size="15" font-weight="600" fill="#B45309">K_txt , V_txt</text>

<rect x="380" y="680" width="380" height="300" rx="12" fill="#FFF" stroke="#0E7490" stroke-width="2.4" filter="url(#sh)"/>
<text x="570" y="710" text-anchor="middle" font-size="19" font-weight="700" fill="#0E7490">image spatial tokens [B,49,128]</text>
<text x="570" y="734" text-anchor="middle" font-size="14" fill="#6B7280">ResNet-18 [B,512,7,7] → flatten 7×7 = 49 → Linear(512→128)</text>
<g id="minixray">
  <rect x="479" y="750" width="182" height="182" rx="4" fill="#22303C"/>
  <ellipse cx="524" cy="841" rx="32" ry="58" fill="#41545F"/><ellipse cx="616" cy="841" rx="32" ry="58" fill="#41545F"/>
  <rect x="566" y="782" width="8" height="128" rx="4" fill="#8FA3AD"/>
</g>
<g fill="#4DD6E8" fill-opacity=".85" filter="url(#glow)">
  <rect x="505" y="802" width="26" height="26"/><rect x="479" y="828" width="26" height="26"/><rect x="505" y="828" width="26" height="26"/>
</g>
