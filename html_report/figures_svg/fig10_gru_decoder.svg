<g filter="url(#sh)">
  <rect x="235" y="300" width="130" height="100" rx="12" fill="#FFF" stroke="#1D4ED8" stroke-width="3"/>
  <rect x="555" y="300" width="130" height="100" rx="12" fill="#FFF" stroke="#1D4ED8" stroke-width="3"/>
