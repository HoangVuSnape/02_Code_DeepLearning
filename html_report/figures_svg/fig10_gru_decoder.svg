<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<!-- Hình ⑩: GRU decoder + Cross-Attention. Sửa so với bản Gemini:
     1. Chuỗi sinh ĐÚNG: <bos> → "right" → "lung" → <eos>   (bản cũ ra "right right <eos>", mất từ "lung")
     2. Mũi tên autoregressive chạy ĐÚNG CHIỀU THỜI GIAN t → t+1 (bản cũ chỉ ngược về t−1)
     3. [B,49,128] kèm dẫn xuất 7×7=49 + Linear(512→128)  (bản cũ ghi [B,256,128], mâu thuẫn ResNet 7×7)
     4. Cross-attention KHÉP MẠCH: query đi lên (nét đứt) VÀ context đi xuống (nét liền)
     5. 4 cell có nhãn input GIỐNG HỆT NHAU (bản cũ mỗi cell thiếu một nhãn khác nhau)
     6. Bước 4 ghi rõ KHÔNG chạy vì đã gặp <eos> (bản cũ vẽ ghost mâu thuẫn)
     7. c_t ghi rõ cách hợp nhất 2 nguồn khác chiều (128 và 64)
-->
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
  <marker id="asl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="1130" fill="#F6F8FB"/>

<!-- ===== BANNER ===== -->
<rect x="0" y="0" width="1600" height="72" fill="#1D4ED8"/>
<text x="800" y="46" text-anchor="middle" font-size="27" fill="#FFF">
  p(y₁:T | I, q) = ∏<tspan font-size="17" dy="6">t=1..T</tspan><tspan dy="-6"> </tspan>p(y_t | y&lt;t, I, q)
</text>

<!-- ===== GENERATED TOKENS ===== -->
<text x="30" y="122" font-size="18" font-weight="700" fill="#15803D">Token sinh ra</text>
<g filter="url(#sh)">
  <rect x="250" y="96" width="100" height="54" rx="10" fill="#15803D"/>
  <rect x="570" y="96" width="100" height="54" rx="10" fill="#15803D"/>
  <rect x="890" y="96" width="100" height="54" rx="10" fill="#15803D"/>
  <rect x="1210" y="96" width="100" height="54" rx="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 4"/>
</g>
<g text-anchor="middle" font-size="20" font-weight="700" fill="#FFF">
  <text x="300" y="130">right</text><text x="620" y="130">lung</text><text x="940" y="130">&lt;eos&gt;</text>
</g>
<text x="1260" y="130" text-anchor="middle" font-size="20" fill="#94A3B8">—</text>

