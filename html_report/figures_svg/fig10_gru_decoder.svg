  <text x="898" y="767" fill="#1F2937">is</text><text x="984" y="767" fill="#1F2937">there</text>
  <text x="1070" y="767" fill="#FFF" font-weight="700">right</text><text x="1156" y="767" fill="#FFF" font-weight="700">lung</text>
  <text x="1242" y="767" fill="#1F2937">?</text>
</g>
<text x="1070" y="816" text-anchor="middle" font-size="15" fill="#B45309">t = 2: trọng số dồn vào “right” và “lung”</text>

<!-- ===== FINAL ANSWER ===== -->
<rect x="840" y="866" width="460" height="114" rx="12" fill="#E8F6EC" stroke="#15803D" stroke-width="2.6"/>
<text x="1070" y="898" text-anchor="middle" font-size="17" fill="#14532D">Chuỗi sinh ra</text>
<text x="1070" y="932" text-anchor="middle" font-size="22" font-weight="700" fill="#14532D">&lt;bos&gt;  right  lung  &lt;eos&gt;</text>
<text x="1070" y="962" text-anchor="middle" font-size="18" fill="#15803D">Đáp án = “right lung”  ·  dừng tại &lt;eos&gt; ở t = 3</text>

<!-- ===== STEP 4 NOTE ===== -->
<rect x="1350" y="300" width="230" height="210" rx="12" fill="#FFF" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1465" y="332" text-anchor="middle" font-size="16" font-weight="700" fill="#64748B">Bước 4 KHÔNG chạy</text>
<text x="1465" y="362" text-anchor="middle" font-size="15" fill="#6B7280">vòng lặp dừng ngay khi</text>
<text x="1465" y="384" text-anchor="middle" font-size="15" fill="#6B7280">sinh ra &lt;eos&gt; ở t = 3.</text>
<text x="1465" y="418" text-anchor="middle" font-size="15" fill="#6B7280">Nếu không gặp &lt;eos&gt;,</text>
<text x="1465" y="440" text-anchor="middle" font-size="15" fill="#6B7280">dừng cứng tại</text>
<text x="1465" y="464" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">MAX_ANSWER_LEN</text>

<!-- ===== TRAIN / INFERENCE ===== -->
<rect x="24" y="1000" width="778" height="106" rx="12" fill="#FFF" stroke="#1D4ED8" stroke-width="2"/>
<line x1="413" y1="1012" x2="413" y2="1094" stroke="#CBD5E1" stroke-width="2"/>
<text x="46" y="1032" font-size="17" font-weight="700" fill="#1E3A8A">TRAIN — teacher forcing</text>
<text x="46" y="1057" font-size="15" fill="#334155">input là token ground-truth,</text>
<text x="46" y="1080" font-size="15" fill="#334155">loss = cross-entropy trên toàn chuỗi</text>
<text x="435" y="1032" font-size="17" font-weight="700" fill="#1E3A8A">INFERENCE — greedy / beam</text>
<text x="435" y="1057" font-size="15" fill="#334155">input là token model tự sinh ở bước trước</text>
<text x="435" y="1080" font-size="15" fill="#334155">(chính là đường xanh lá “autoregressive”)</text>

<rect x="826" y="1000" width="754" height="106" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="2"/>
<circle cx="864" cy="1036" r="17" fill="#B45309"/>
<text x="864" y="1043" text-anchor="middle" font-size="21" font-weight="700" fill="#FFF">!</text>
<text x="894" y="1032" font-size="18" font-weight="700" fill="#7C2D12">Thay thế MLP classifier cũ</text>
<text x="894" y="1058" font-size="16" fill="#92400E">không còn Linear(fused → 128 → C) + argmax trên tập lớp đáp án</text>
<text x="894" y="1082" font-size="16" fill="#92400E">→ mô hình sinh được đáp án nhiều từ, kể cả đáp án chưa từng thấy nguyên cụm</text>
</svg>
