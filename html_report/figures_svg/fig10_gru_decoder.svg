</g>
<line x1="1007" y1="350" x2="1191" y2="350" stroke="#CBD5E1" stroke-width="3.4" marker-end="url(#asl)" stroke-dasharray="7 5"/>
<g font-size="15" fill="#1D4ED8" text-anchor="middle">
  <text x="459" y="340">h₁ [B,128]</text><text x="779" y="340">h₂ [B,128]</text>
</g>

<!-- ===== INPUT TOKEN CHIPS ===== -->
<text x="30" y="490" font-size="18" font-weight="700" fill="#334155">Input bước t</text>
<text x="30" y="512" font-size="15" fill="#6B7280">= token bước t−1</text>
<g filter="url(#sh)">
  <rect x="207" y="455" width="96" height="54" rx="10" fill="#FFF" stroke="#334155" stroke-width="2.2"/>
  <rect x="527" y="455" width="96" height="54" rx="10" fill="#FFF" stroke="#334155" stroke-width="2.2"/>
