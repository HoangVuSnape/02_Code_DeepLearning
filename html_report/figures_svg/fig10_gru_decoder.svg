<g filter="url(#sh)">
  <rect x="200" y="182" width="200" height="72" rx="10" fill="#FFF" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="520" y="182" width="200" height="72" rx="10" fill="#FFF" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="840" y="182" width="200" height="72" rx="10" fill="#FFF" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="1160" y="182" width="200" height="72" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 4"/>
</g>
<g text-anchor="middle" font-size="16" fill="#1F2937">
  <text x="300" y="210">Linear(128 → V_ans)</text><text x="300" y="236" fill="#1D4ED8">logits [B,V_ans]</text>
  <text x="620" y="210">Linear(128 → V_ans)</text><text x="620" y="236" fill="#1D4ED8">logits [B,V_ans]</text>
  <text x="940" y="210">Linear(128 → V_ans)</text><text x="940" y="236" fill="#1D4ED8">logits [B,V_ans]</text>
  <text x="1260" y="222" fill="#94A3B8">không chạy</text>
</g>
<g stroke="#15803D" stroke-width="2.6" marker-end="url(#ag)">
  <line x1="300" y1="178" x2="300" y2="156"/><line x1="620" y1="178" x2="620" y2="156"/><line x1="940" y1="178" x2="940" y2="156"/>
</g>
<g font-size="13" fill="#15803D" text-anchor="start">
  <text x="308" y="172">argmax / sample</text><text x="628" y="172">argmax / sample</text><text x="948" y="172">argmax / sample</text>
</g>
<g stroke="#1D4ED8" stroke-width="2.6" marker-end="url(#ab)">
  <line x1="300" y1="296" x2="300" y2="260"/><line x1="620" y1="296" x2="620" y2="260"/><line x1="940" y1="296" x2="940" y2="260"/>
</g>

<!-- ===== INIT h0 ===== -->
<rect x="24" y="182" width="150" height="62" rx="10" fill="#7C3AED" filter="url(#sh)"/>
<text x="99" y="206" text-anchor="middle" font-size="17" font-weight="600" fill="#FFF">fused</text>
<text x="99" y="230" text-anchor="middle" font-size="16" fill="#E9D8FD">[B,192] / [B,2P]</text>
<line x1="99" y1="248" x2="99" y2="286" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#ab)"/>
<rect x="14" y="290" width="170" height="60" rx="10" fill="#FFF" stroke="#1D4ED8" stroke-width="2" filter="url(#sh)"/>
<text x="99" y="326" text-anchor="middle" font-size="17" fill="#1F2937">Linear(fused → 128)</text>
<path d="M99,354 L99,384 L229,384" fill="none" stroke="#1D4ED8" stroke-width="3" marker-end="url(#ab)"/>
<text x="112" y="376" font-size="16" font-weight="600" fill="#1D4ED8">h₀ [B,128]</text>

