  <path d="M505,750 v182 M531,750 v182 M557,750 v182 M583,750 v182 M609,750 v182 M635,750 v182"/>
  <path d="M479,776 h182 M479,802 h182 M479,828 h182 M479,854 h182 M479,880 h182 M479,906 h182"/>
</g>
<rect x="479" y="750" width="182" height="182" fill="none" stroke="#0E7490" stroke-width="2"/>
<text x="570" y="950" text-anchor="middle" font-size="14" fill="#0E7490">t = 2: 3 patch phổi PHẢI bệnh nhân sáng lên</text>
<text x="570" y="970" text-anchor="middle" font-size="13" fill="#64748B">(quy ước X-quang: phải bệnh nhân = trái ảnh)</text>

<rect x="840" y="680" width="460" height="160" rx="12" fill="#FFF" stroke="#B45309" stroke-width="2.4" filter="url(#sh)"/>
<text x="1070" y="710" text-anchor="middle" font-size="19" font-weight="700" fill="#B45309">question hidden states [B,32,64]</text>
<g>
