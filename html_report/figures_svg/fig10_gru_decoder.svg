  <rect x="1167" y="455" width="96" height="54" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 4"/>
</g>
<g text-anchor="middle" font-size="18" fill="#1F2937">
