<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<!-- Hình ⑥: Temporal Attention. Sửa so với bản Gemini:
     - hai cột <pad> có chiều cao BẰNG 0 thật (bản cũ vẽ ô xám cao ngang cột 0.12 dù nhãn ghi α = 0)
     - chỉ MỘT bộ dây nối; bỏ thanh ray đi vào hư không và mũi tên lơ lửng
     - chỉ MỘT hộp "context" (bản cũ có 2 hộp trùng tên, không nối với nhau)
     - mọi cột chung MỘT baseline, có trục tung để đối chiếu
     - mọi cột cùng một màu (bản cũ tô cột 0.42 khác hẳn → đọc như category khác)
     - Σ, α, · dùng Unicode
-->
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="900" fill="#F6F8FB"/>

<!-- ===== FLOW ===== -->
<g filter="url(#sh)">
  <rect x="100" y="86" width="260" height="84" rx="11" fill="#FFF" stroke="#B45309" stroke-width="2"/>
  <rect x="400" y="86" width="340" height="84" rx="11" fill="#FFF" stroke="#B45309" stroke-width="2"/>
  <rect x="780" y="86" width="340" height="84" rx="11" fill="#FFF" stroke="#B45309" stroke-width="2"/>
</g>
<text x="230" y="120" text-anchor="middle" font-size="18" fill="#1F2937">outputs H</text>
<text x="230" y="146" text-anchor="middle" font-size="18" fill="#B45309">[B,T,H]</text>
<text x="570" y="120" text-anchor="middle" font-size="18" fill="#1F2937">Linear(H → 1)</text>
<text x="570" y="146" text-anchor="middle" font-size="18" fill="#B45309">→ scores [B,T]</text>
<text x="950" y="118" text-anchor="middle" font-size="18" fill="#1F2937">mask PAD + softmax</text>
<text x="950" y="146" text-anchor="middle" font-size="17" fill="#B45309">α [B,T] ,  Σ α = 1</text>
<g stroke="#B45309" stroke-width="2.6" marker-end="url(#a)">
  <line x1="362" y1="128" x2="396" y2="128"/><line x1="742" y1="128" x2="776" y2="128"/>
  <line x1="950" y1="174" x2="950" y2="216"/>
</g>
<text x="966" y="202" font-size="15" fill="#B45309">α</text>

<!-- ===== Y AXIS ===== -->
<line x1="100" y1="250" x2="100" y2="700" stroke="#94A3B8" stroke-width="2"/>
<g stroke="#E2E8F0" stroke-width="1.4">
  <line x1="100" y1="600" x2="1030" y2="600"/><line x1="100" y1="500" x2="1030" y2="500"/>
  <line x1="100" y1="400" x2="1030" y2="400"/><line x1="100" y1="300" x2="1030" y2="300"/>
</g>
<g font-size="14" fill="#64748B" text-anchor="end">
  <text x="92" y="705">0</text><text x="92" y="605">0.1</text><text x="92" y="505">0.2</text>
  <text x="92" y="405">0.3</text><text x="92" y="305">0.4</text>
</g>
<line x1="100" y1="700" x2="1030" y2="700" stroke="#334155" stroke-width="2.4"/>
<text x="60" y="470" font-size="15" fill="#64748B" transform="rotate(-90 60 470)" text-anchor="middle">trọng số α</text>

<!-- ===== converge lines : vẽ TRƯỚC các cột nên chạy PHÍA SAU, không đè lên cột ===== -->
<g stroke="#D97706" stroke-width="1.8" fill="none">
  <path d="M175,616 L1174,458"/><path d="M305,626 L1174,458"/><path d="M435,386 L1174,458"/>
  <path d="M565,276 L1174,458"/><path d="M695,576 L1174,458"/>
</g>

<!-- ===== BARS : shared baseline, uniform colour ===== -->
<g fill="#D97706">
  <rect x="140" y="620" width="70" height="80"/>
  <rect x="270" y="630" width="70" height="70"/>
  <rect x="400" y="390" width="70" height="310"/>
  <rect x="530" y="280" width="70" height="420"/>
  <rect x="660" y="580" width="70" height="120"/>
</g>
<!-- zero-height PAD bars -->
<g fill="#94A3B8">
  <rect x="790" y="696" width="70" height="4"/>
  <rect x="920" y="696" width="70" height="4"/>
</g>
<g font-size="18" font-weight="700" fill="#92400E" text-anchor="middle">
  <text x="175" y="610">0.08</text><text x="305" y="620">0.07</text><text x="435" y="380">0.31</text>
  <text x="565" y="270">0.42</text><text x="695" y="570">0.12</text>
</g>
<g font-size="17" font-weight="700" fill="#B91C1C" text-anchor="middle">
  <text x="825" y="686">0</text><text x="955" y="686">0</text>
</g>

<!-- ===== TOKEN CHIPS ===== -->
<g filter="url(#sh)">
  <rect x="120" y="720" width="110" height="54" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/>
  <rect x="250" y="720" width="110" height="54" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/>
  <rect x="380" y="720" width="110" height="54" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/>
  <rect x="510" y="720" width="110" height="54" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/>
  <rect x="640" y="720" width="110" height="54" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/>
  <rect x="770" y="720" width="110" height="54" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <rect x="900" y="720" width="110" height="54" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
</g>
<g font-size="18" text-anchor="middle" fill="#1F2937">
  <text x="175" y="754">is</text><text x="305" y="754">there</text><text x="435" y="754">pleural</text>
  <text x="565" y="754">effusion</text><text x="695" y="754">?</text>
</g>
<g font-size="17" text-anchor="middle" fill="#64748B">
  <text x="825" y="754">&lt;pad&gt;</text><text x="955" y="754">&lt;pad&gt;</text>
</g>
<g stroke="#B91C1C" stroke-width="3.4" stroke-linecap="round">
  <line x1="782" y1="766" x2="868" y2="728"/><line x1="912" y1="766" x2="998" y2="728"/>
</g>

<!-- ===== SINGLE CONTEXT BOX ===== -->
<rect x="1180" y="404" width="300" height="112" rx="12" fill="#E8F6EC" stroke="#15803D" stroke-width="2.8" filter="url(#sh)"/>
<text x="1330" y="440" text-anchor="middle" font-size="21" font-weight="700" fill="#14532D">context [B,H]</text>
<text x="1330" y="472" text-anchor="middle" font-size="19" fill="#15803D">= Σₜ αₜ · hₜ</text>
<text x="1330" y="500" text-anchor="middle" font-size="15" fill="#6B7280">tổng có trọng số của mọi bước</text>

<!-- ===== PAD NOTE ===== -->
<rect x="1080" y="592" width="420" height="118" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
<text x="1104" y="624" font-size="17" font-weight="700" fill="#991B1B">Hai vị trí &lt;pad&gt; bị mask</text>
<text x="1104" y="652" font-size="16" fill="#7F1D1D">scores đặt −∞ TRƯỚC softmax → α = 0</text>
<text x="1104" y="678" font-size="16" fill="#7F1D1D">cột cao đúng bằng 0, và</text>
<text x="1104" y="700" font-size="16" fill="#7F1D1D">KHÔNG có đường nối tới context</text>

<!-- ===== CAPTION ===== -->
<rect x="100" y="820" width="1400" height="58" rx="12" fill="#FFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="800" y="846" text-anchor="middle" font-size="18" fill="#1F2937">Từ khoá lâm sàng quan trọng nhận trọng số cao, thay vì chỉ dựa vào trạng thái ẩn cuối cùng.</text>
<text x="800" y="868" text-anchor="middle" font-size="15" fill="#6B7280">0.08 + 0.07 + 0.31 + 0.42 + 0.12 + 0 + 0 = 1.00</text>
</svg>
