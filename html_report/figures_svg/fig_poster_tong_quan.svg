<text x="421" y="290" text-anchor="middle" font-size="13" fill="#64748B">ablation</text>
<rect x="498" y="248" width="76" height="56" rx="9" fill="#0E7490"/>
<text x="536" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">v_img</text>
<text x="536" y="292" text-anchor="middle" font-size="14" fill="#CFF0F7">[B,128]</text>
<g stroke="#0E7490" stroke-width="2.2" marker-end="url(#mt)">
  <line x1="138" y1="276" x2="156" y2="276"/><line x1="346" y1="276" x2="364" y2="276"/><line x1="478" y1="276" x2="494" y2="276"/>
</g>

