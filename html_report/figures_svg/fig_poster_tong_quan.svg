  <rect x="368" y="486" width="106" height="92" rx="9" fill="#FFF" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5"/>
</g>
<text x="251" y="492" text-anchor="middle" font-size="16" fill="#1F2937">BiLSTM</text>
<text x="251" y="540" text-anchor="middle" font-size="15" font-style="italic" fill="#64748B">hoặc</text>
<text x="251" y="584" text-anchor="middle" font-size="16" fill="#1F2937">Transformer Encoder</text>
<text x="421" y="516" text-anchor="middle" font-size="15" fill="#1F2937">Temporal</text>
<text x="421" y="536" text-anchor="middle" font-size="15" fill="#1F2937">Attention</text>
<text x="421" y="558" text-anchor="middle" font-size="13" fill="#64748B">ablation</text>
<rect x="498" y="504" width="76" height="56" rx="9" fill="#B45309"/>
<text x="536" y="528" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">v_txt</text>
<text x="536" y="548" text-anchor="middle" font-size="14" fill="#FDE9CE">[B,64]</text>
<g stroke="#B45309" stroke-width="2.2" marker-end="url(#ma)">
  <line x1="142" y1="532" x2="156" y2="532"/><line x1="346" y1="532" x2="364" y2="532"/><line x1="478" y1="532" x2="494" y2="532"/>
</g>

<!-- ================= ZONE B : FUSION ================= -->
<rect x="628" y="110" width="486" height="296" rx="14" fill="#F5EFFE" stroke="#7C3AED" stroke-width="2"/>
<text x="646" y="140" font-size="21" font-weight="700" fill="#0F172A">B · CĂN CHỈNH &amp; HỢP NHẤT</text>
<g filter="url(#sh)">
  <rect x="646" y="162" width="200" height="48" rx="9" fill="#FFF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="646" y="220" width="200" height="48" rx="9" fill="#FFF" stroke="#7C3AED" stroke-width="2"/>
</g>
<text x="746" y="192" text-anchor="middle" font-size="15" fill="#1F2937">Img Projector 128 → P</text>
<text x="746" y="250" text-anchor="middle" font-size="15" fill="#1F2937">Txt Projector 64 → P</text>
<text x="646" y="290" font-size="13" fill="#6B7280">hai module RIÊNG,</text>
<text x="646" y="308" font-size="13" fill="#6B7280">không chia sẻ trọng số</text>
<rect x="884" y="176" width="204" height="62" rx="9" fill="#FFF" stroke="#7C3AED" stroke-width="2.4" filter="url(#sh)"/>
<text x="986" y="200" text-anchor="middle" font-size="16" fill="#1F2937">Concat</text>
<text x="986" y="222" text-anchor="middle" font-size="14" fill="#5B21B6">[B,192] hoặc [B,2P]</text>
<rect x="884" y="262" width="204" height="62" rx="9" fill="#FFF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 5"/>
<text x="986" y="288" text-anchor="middle" font-size="16" fill="#1F2937">Gated Attention</text>
<text x="986" y="310" text-anchor="middle" font-size="13" fill="#64748B">ablation</text>
<g stroke="#7C3AED" stroke-width="2.2" marker-end="url(#mp)">
  <line x1="850" y1="186" x2="880" y2="200"/><line x1="850" y1="244" x2="880" y2="224"/>
  <line x1="986" y1="242" x2="986" y2="258"/>
</g>
