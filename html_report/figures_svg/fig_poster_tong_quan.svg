<text x="1202" y="354" font-size="16" fill="#1F2937">viền đứt = khối tuỳ chọn (ablation)</text>
<text x="1160" y="384" font-size="15" fill="#64748B">Số 1–11 ứng với 11 hình chi tiết trong chương phương pháp.</text>

