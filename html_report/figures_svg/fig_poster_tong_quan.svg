<path d="M602,532 C618,532 618,248 642,248" fill="none" stroke="#B45309" stroke-width="2.4" marker-end="url(#ma)"/>

<!-- ================= ZONE C : GENERATION ================= -->
<rect x="628" y="462" width="560" height="404" rx="14" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="2"/>
<text x="646" y="492" font-size="21" font-weight="700" fill="#0F172A">C · SINH ĐÁP ÁN</text>
<rect x="660" y="512" width="496" height="104" rx="11" fill="#FFF" stroke="#1D4ED8" stroke-width="2.4" filter="url(#sh)"/>
<text x="908" y="542" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A8A">GRU decoder — 1 lớp, hidden 128</text>
<text x="908" y="568" text-anchor="middle" font-size="16" fill="#1F2937">+ Cross-Attention trên image tokens [B,49,128]</text>
<text x="908" y="592" text-anchor="middle" font-size="16" fill="#1F2937">và question states [B,32,64]</text>
<g filter="url(#sh)">
  <rect x="762" y="644" width="292" height="48" rx="9" fill="#FFF" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="762" y="712" width="292" height="48" rx="9" fill="#FFF" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="762" y="782" width="292" height="56" rx="9" fill="#15803D"/>
</g>
<text x="908" y="674" text-anchor="middle" font-size="16" fill="#1F2937">logits [B,T,V_answer]</text>
<text x="908" y="742" text-anchor="middle" font-size="16" fill="#1F2937">greedy / beam search</text>
<text x="908" y="818" text-anchor="middle" font-size="21" font-weight="700" fill="#FFF">“right lung”</text>
<g stroke="#1D4ED8" stroke-width="2.4" marker-end="url(#mb)">
  <line x1="908" y1="620" x2="908" y2="640"/><line x1="908" y1="696" x2="908" y2="708"/><line x1="908" y1="764" x2="908" y2="778"/>
</g>


<!-- ================= ZONE D : RL ================= -->
<rect x="1226" y="462" width="344" height="404" rx="14" fill="#FDEEF1" stroke="#BE123C" stroke-width="2"/>
<text x="1244" y="492" font-size="21" font-weight="700" fill="#0F172A">D · TINH CHỈNH RL</text>
<text x="1244" y="514" font-size="15" font-weight="600" fill="#BE123C">chạy SAU khi đã SFT xong</text>
<g filter="url(#sh)">
  <rect x="1248" y="532" width="300" height="46" rx="9" fill="#FFF" stroke="#BE123C" stroke-width="2"/>
  <rect x="1248" y="606" width="142" height="60" rx="9" fill="#FDE2E7" stroke="#BE123C" stroke-width="2"/>
  <rect x="1406" y="606" width="142" height="60" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.8"/>
  <rect x="1248" y="694" width="300" height="44" rx="9" fill="#FFF" stroke="#BE123C" stroke-width="2"/>
  <rect x="1248" y="766" width="300" height="44" rx="9" fill="#FFF" stroke="#BE123C" stroke-width="2"/>
</g>
<text x="1398" y="560" text-anchor="middle" font-size="16" fill="#1F2937">model sau SFT = policy π</text>
<text x="1319" y="630" text-anchor="middle" font-size="15" font-weight="600" fill="#9F1239">sample</text>
<text x="1319" y="652" text-anchor="middle" font-size="14" fill="#9F1239">r(sample)</text>
<text x="1477" y="630" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">greedy</text>
<text x="1477" y="652" text-anchor="middle" font-size="14" fill="#475569">baseline r(greedy)</text>
<text x="1398" y="722" text-anchor="middle" font-size="16" fill="#1F2937">A = r(sample) − r(greedy)</text>
<text x="1398" y="794" text-anchor="middle" font-size="16" fill="#1F2937">L = −( log π(sample) · A )</text>
<g stroke="#BE123C" stroke-width="2.2" marker-end="url(#mr)">
  <line x1="1319" y1="582" x2="1319" y2="602"/><line x1="1477" y1="582" x2="1477" y2="602"/>
  <line x1="1319" y1="670" x2="1350" y2="690"/><line x1="1477" y1="670" x2="1446" y2="690"/>
  <line x1="1398" y1="742" x2="1398" y2="762"/>
</g>
<path d="M1548,788 C1576,788 1576,556 1552,556" fill="none" stroke="#BE123C" stroke-width="2.6" stroke-dasharray="9 5" marker-end="url(#mr)"/>
<text x="1398" y="832" text-anchor="middle" font-size="13" fill="#9F1239">cập nhật policy · lr 1e-5</text>
<text x="1398" y="852" text-anchor="middle" font-size="13" fill="#9F1239">giữ checkpoint val EM tốt nhất</text>

