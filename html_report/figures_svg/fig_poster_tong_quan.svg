  <ellipse cx="79" cy="278" rx="13" ry="24" fill="#41545F"/><ellipse cx="113" cy="278" rx="13" ry="24" fill="#41545F"/>
  <rect x="93" y="252" width="4" height="52" rx="2" fill="#8FA3AD"/></g>
