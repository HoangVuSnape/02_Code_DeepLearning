<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<!-- Poster tổng quan 1 trang. Sửa so với bản Gemini:
     - tiêu đề THẬT (bản cũ in nguyên dòng prompt + chữ rác "ywllmodul medimad")
     - bỏ nhãn "ZONE 1/2/4"; cả 4 vùng đều có heading, không thiếu vùng nào (bản cũ mất heading vùng 3)
     - legend: RL đổi sang đỏ #BE123C để KHÁC màu text (bản cũ text và RL trùng cam → legend vô dụng)
     - chip câu hỏi là token thật (bản cũ ghi "Q??")
     - đánh số ①–⑪ khớp ĐÚNG 11 hình chi tiết, mỗi module 1 số, không trùng, không thiếu
     - mũi tên luồng chính nối box-đến-box, đầu mũi luôn đáp vào đích (bản cũ gãy 3 khúc, mũi cuối chỉ vào khoảng trắng)
-->
<defs>
  <marker id="mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
  <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
  <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#BE123C"/></marker>
  <marker id="big" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="920" fill="#F6F8FB"/>

<!-- ===== TITLE ===== -->
<text x="30" y="46" font-size="30" font-weight="700" fill="#0F172A">Kiến trúc Multimodal Medical VQA — tổng quan một trang</text>
<text x="30" y="76" font-size="17" fill="#64748B">Sinh đáp án theo token · bộ dữ liệu VQA-RAD · mỗi nhánh có 2 lựa chọn để thiết kế ablation</text>
<line x1="30" y1="92" x2="1570" y2="92" stroke="#CBD5E1" stroke-width="2"/>

<!-- ===== MAIN FLOW ARROWS ===== -->
<path d="M600,400 L628,400" stroke="#94A3B8" stroke-width="14" fill="none" marker-end="url(#big)"/>
<path d="M870,406 L870,462" stroke="#94A3B8" stroke-width="14" fill="none" marker-end="url(#big)"/>
<path d="M1188,660 L1226,660" stroke="#94A3B8" stroke-width="14" fill="none" marker-end="url(#big)"/>

<!-- ================= ZONE A : ENCODERS ================= -->
<rect x="30" y="110" width="570" height="580" rx="14" fill="#FFF" stroke="#94A3B8" stroke-width="2"/>
<text x="48" y="140" font-size="21" font-weight="700" fill="#0F172A">A · BỘ MÃ HOÁ (ENCODERS)</text>
<text x="48" y="162" font-size="15" fill="#64748B">hai lựa chọn cho mỗi nhánh = thiết kế ablation</text>

