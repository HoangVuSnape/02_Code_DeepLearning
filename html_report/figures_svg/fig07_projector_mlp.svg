  <line x1="1360" y1="596" x2="1388" y2="612"/>
  <line x1="952" y1="666" x2="980" y2="682"/><line x1="1060" y1="658" x2="1088" y2="674"/>
  <line x1="1170" y1="672" x2="1198" y2="688"/><line x1="1280" y1="654" x2="1308" y2="670"/>
</g>
