</g>

<text x="378" y="580" text-anchor="middle" font-size="38" font-weight="700" fill="#B91C1C">≠</text>

<rect x="416" y="418" width="270" height="300" rx="11" fill="#FFF" stroke="#B45309" stroke-width="2"/>
<text x="551" y="446" text-anchor="middle" font-size="16" font-weight="600" fill="#B45309">không gian văn bản</text>
<text x="551" y="470" text-anchor="middle" font-size="17" fill="#B45309">ℝ<tspan font-size="12" dy="-6">64</tspan></text>
<g fill="#B45309">
  <circle cx="456" cy="512" r="7"/><circle cx="496" cy="536" r="7"/><circle cx="538" cy="504" r="7"/>
  <circle cx="578" cy="544" r="7"/><circle cx="618" cy="514" r="7"/><circle cx="650" cy="550" r="7"/>
  <circle cx="466" cy="582" r="7"/><circle cx="510" cy="608" r="7"/><circle cx="552" cy="574" r="7"/>
  <circle cx="596" cy="620" r="7"/><circle cx="634" cy="592" r="7"/><circle cx="658" cy="628" r="7"/>
  <circle cx="452" cy="656" r="7"/><circle cx="494" cy="684" r="7"/><circle cx="542" cy="652" r="7"/>
  <circle cx="588" cy="692" r="7"/><circle cx="628" cy="664" r="7"/><circle cx="656" cy="698" r="7"/>
</g>
<text x="378" y="748" text-anchor="middle" font-size="16" fill="#B91C1C">Hai không gian KHÁC số chiều — không so sánh</text>
<text x="378" y="770" text-anchor="middle" font-size="16" fill="#B91C1C">hay ghép trực tiếp được</text>

<path d="M710,568 L710,548 L800,548 L800,522 L860,573 L800,624 L800,598 L710,598 Z" fill="#7C3AED"/>
<text x="785" y="662" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">Projector</text>

<rect x="900" y="418" width="520" height="300" rx="11" fill="#FFF" stroke="#7C3AED" stroke-width="2.4"/>
<text x="1160" y="446" text-anchor="middle" font-size="16" font-weight="600" fill="#5B21B6">không gian chung</text>
<text x="1160" y="470" text-anchor="middle" font-size="17" fill="#5B21B6">ℝ<tspan font-size="12" dy="-6">P</tspan></text>
<g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4">
  <line x1="948" y1="512" x2="976" y2="528"/><line x1="1044" y1="504" x2="1072" y2="520"/>
