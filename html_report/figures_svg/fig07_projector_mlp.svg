  <circle cx="948" cy="512" r="7"/><circle cx="1044" cy="504" r="7"/><circle cx="1148" cy="522" r="7"/>
  <circle cx="1250" cy="500" r="7"/><circle cx="1348" cy="520" r="7"/>
  <circle cx="962" cy="592" r="7"/><circle cx="1064" cy="584" r="7"/><circle cx="1166" cy="600" r="7"/>
