  <circle cx="952" cy="666" r="7"/><circle cx="1060" cy="658" r="7"/><circle cx="1170" cy="672" r="7"/>
  <circle cx="1280" cy="654" r="7"/>
</g>
<g fill="#B45309">
  <circle cx="976" cy="528" r="7"/><circle cx="1072" cy="520" r="7"/><circle cx="1176" cy="538" r="7"/>
  <circle cx="1278" cy="516" r="7"/><circle cx="1376" cy="536" r="7"/>
  <circle cx="990" cy="608" r="7"/><circle cx="1092" cy="600" r="7"/><circle cx="1194" cy="616" r="7"/>
  <circle cx="1296" cy="596" r="7"/><circle cx="1388" cy="612" r="7"/>
  <circle cx="980" cy="682" r="7"/><circle cx="1088" cy="674" r="7"/><circle cx="1198" cy="688" r="7"/>
  <circle cx="1308" cy="670" r="7"/>
</g>
<text x="1160" y="748" text-anchor="middle" font-size="16" fill="#15803D">Cùng số chiều P, cặp ảnh–văn bản tương ứng nằm gần nhau</text>
<text x="1160" y="770" text-anchor="middle" font-size="16" fill="#15803D">— fusion và cross-attention trở nên dễ</text>

<!-- ===== DISCLAIMER ===== -->
<rect x="70" y="806" width="1350" height="56" rx="11" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="94" y="832" font-size="16" font-weight="700" fill="#334155">Lưu ý:</text>
<text x="160" y="832" font-size="16" fill="#475569">hai panel dưới là MINH HOẠ KHÁI NIỆM, không phải kết quả t-SNE/UMAP đo trên dữ liệu thật.</text>
<text x="94" y="854" font-size="15" fill="#64748B">Chỉ dùng để giải thích vì sao cần đưa hai modality về cùng một không gian trước khi hợp nhất.</text>
</svg>
