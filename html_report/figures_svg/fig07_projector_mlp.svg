<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<!-- Hình ⑦: Projector MLP. Sửa so với bản Gemini:
     - HAI projector RIÊNG BIỆT (bản cũ vẽ 1 hộp MLP nhận cả input 128 chiều lẫn 64 chiều
       → bất khả thi: nn.Linear chỉ nhận đúng một in_features)
     - bỏ chữ rác "UPPER HALF" / "LOWER HALF"
     - bỏ biến "d" không định nghĩa — ghi thẳng 128 và 64
     - hộp concat tô TÍM đúng quy ước fusion, và có mũi tên đi tiếp (không còn ngõ cụt)
     - phần "trước projector" vẽ thành HAI panel riêng có số chiều khác nhau, thay vì
       vẽ chung 1 mặt phẳng 2D (128 chiều và 64 chiều vốn không cùng không gian để vẽ chung)
     - có ghi chú rõ: minh hoạ khái niệm, không phải kết quả đo
-->
<defs>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="900" fill="#F6F8FB"/>

<!-- ===== FLOW ===== -->
<rect x="50" y="104" width="140" height="66" rx="10" fill="#0E7490" filter="url(#sh)"/>
<text x="120" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF">v_img</text>
<text x="120" y="154" text-anchor="middle" font-size="17" fill="#CFF0F7">[B,128]</text>
<rect x="50" y="204" width="140" height="66" rx="10" fill="#B45309" filter="url(#sh)"/>
<text x="120" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF">v_txt</text>
<text x="120" y="254" text-anchor="middle" font-size="17" fill="#FDE9CE">[B,64]</text>

<rect x="250" y="90" width="400" height="88" rx="11" fill="#F5EFFE" stroke="#7C3AED" stroke-width="2.4" filter="url(#sh)"/>
<text x="450" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">Img Projector</text>
<text x="450" y="150" text-anchor="middle" font-size="16" fill="#1F2937">Linear(128 → P) → GELU → Linear(P → P) → LayerNorm</text>
<rect x="250" y="196" width="400" height="88" rx="11" fill="#F5EFFE" stroke="#7C3AED" stroke-width="2.4" filter="url(#sh)"/>
<text x="450" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">Txt Projector</text>
<text x="450" y="256" text-anchor="middle" font-size="16" fill="#1F2937">Linear(64 → P) → GELU → Linear(P → P) → LayerNorm</text>

<line x1="194" y1="137" x2="246" y2="134" stroke="#0E7490" stroke-width="2.6" marker-end="url(#at)"/>
<line x1="194" y1="237" x2="246" y2="240" stroke="#B45309" stroke-width="2.6" marker-end="url(#aa)"/>

<rect x="200" y="296" width="500" height="36" rx="8" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.6"/>
<text x="450" y="320" text-anchor="middle" font-size="14" fill="#713F12">HAI module riêng — số chiều vào khác nhau, KHÔNG chia sẻ trọng số</text>

<rect x="700" y="104" width="130" height="66" rx="10" fill="#7C3AED" filter="url(#sh)"/>
<text x="765" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF">z_img</text>
<text x="765" y="154" text-anchor="middle" font-size="17" fill="#E9D8FD">[B,P]</text>
<rect x="700" y="204" width="130" height="66" rx="10" fill="#7C3AED" filter="url(#sh)"/>
<text x="765" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF">z_txt</text>
<text x="765" y="254" text-anchor="middle" font-size="17" fill="#E9D8FD">[B,P]</text>
<line x1="654" y1="134" x2="696" y2="137" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#ap)"/>
<line x1="654" y1="240" x2="696" y2="237" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#ap)"/>

<rect x="890" y="148" width="190" height="80" rx="11" fill="#7C3AED" filter="url(#sh)"/>
<text x="985" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#FFF">concat</text>
<text x="985" y="208" text-anchor="middle" font-size="18" fill="#E9D8FD">[B,2P]</text>
<path d="M834,134 L862,134 L862,172 L886,172" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#ap)"/>
<path d="M834,240 L862,240 L862,204 L886,204" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#ap)"/>

<line x1="1084" y1="188" x2="1136" y2="188" stroke="#2563EB" stroke-width="2.8" marker-end="url(#ab)"/>
<rect x="1140" y="154" width="200" height="68" rx="11" fill="#FFF" stroke="#2563EB" stroke-width="2.4" filter="url(#sh)"/>
<text x="1240" y="196" text-anchor="middle" font-size="19" fill="#1E3A8A">GRU Decoder</text>

<!-- ===== WHY : before / after ===== -->
<text x="70" y="392" font-size="21" font-weight="700" fill="#0F172A">Vì sao cần projector</text>

<rect x="70" y="418" width="270" height="300" rx="11" fill="#FFF" stroke="#0E7490" stroke-width="2"/>
<text x="205" y="446" text-anchor="middle" font-size="16" font-weight="600" fill="#0E7490">không gian ảnh</text>
<text x="205" y="470" text-anchor="middle" font-size="17" fill="#0E7490">ℝ<tspan font-size="12" dy="-6">128</tspan></text>
<g fill="#0E7490">
  <circle cx="110" cy="512" r="7"/><circle cx="150" cy="532" r="7"/><circle cx="192" cy="502" r="7"/>
