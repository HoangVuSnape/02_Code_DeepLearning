<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<!-- Hình ①: CustomCNN (3 blocks). Sửa so với bản Gemini:
     - TỈ LỆ KHÔNG GIAN VÀ KÊNH:
       + Chiều cao slab nén ĐÚNG ½ mỗi bước: 100px (224/112) → 50px (56) → 25px (28)
       + Số slab tăng dần chuẩn: 4 slab (32 ch) → 6 slab (64 ch) → 8 slab (128 ch)
       + Stack đầu vẽ 4 slab (tránh nhầm với 3 kênh input RGB)
     - Xoá hộp "AvgPool + LayerNorm" lặp lại ở hàng dưới
     - Hộp SE-Block có chữ "SE-Block (optional / ablation)", không bị rỗng
     - Luồng 1 hàng phẳng ngang, có mũi tên nối liên tục
     - Dùng ký hiệu Unicode chuẩn: ×, →, ·
-->
<defs>
  <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker>
  <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <pattern id="vecCell" width="16" height="40" patternUnits="userSpaceOnUse">
    <rect width="16" height="40" fill="#0E7490"/><rect x="15" width="1" height="40" fill="#F6F8FB"/></pattern>
</defs>

<rect width="1600" height="900" fill="#F6F8FB"/>

<!-- ===== TITLE BANNER ===== -->
<text x="50" y="52" font-size="26" font-weight="700" fill="#0F172A">CustomCNN — Mạng nơ-ron cuộn 3 lớp trích đặc trưng ảnh</text>
<text x="50" y="80" font-size="16" fill="#64748B">Quy luật: Không gian thu hẹp (224 → 112 → 56 → 28), độ sâu kênh tăng (3 → 32 → 64 → 128)</text>
<line x1="50" y1="96" x2="1550" y2="96" stroke="#CBD5E1" stroke-width="1.8"/>

<!-- ================= STEP 1: INPUT IMAGE ================= -->
<g filter="url(#sh)">
  <rect x="50" y="320" width="130" height="130" rx="8" fill="#22303C" stroke="#0E7490" stroke-width="2"/>
  <ellipse cx="85" cy="385" rx="22" ry="38" fill="#41545F"/>
  <ellipse cx="145" cy="385" rx="22" ry="38" fill="#41545F"/>
  <rect x="111" y="340" width="5" height="90" rx="2.5" fill="#8FA3AD"/>
  <g stroke="#8FA3AD" stroke-width="1.4" fill="none" opacity=".75">
    <path d="M60,360 Q85,350 108,355"/><path d="M60,380 Q85,370 108,375"/><path d="M60,400 Q85,390 108,395"/>
    <path d="M118,355 Q143,350 168,360"/><path d="M118,375 Q143,370 168,380"/><path d="M118,395 Q143,390 168,400"/>
  </g>
</g>
<text x="115" y="474" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2937">Ảnh đầu vào</text>
<text x="115" y="496" text-anchor="middle" font-size="15" fill="#0E7490">[B, 3, 224, 224]</text>

<line x1="192" y1="385" x2="228" y2="385" stroke="#0E7490" stroke-width="2.6" marker-end="url(#arT)"/>

<!-- ================= STEP 2: BLOCK 1 (32 CH, SPATIAL 112) ================= -->
<g filter="url(#sh)">
  <rect x="240" y="320" width="170" height="130" rx="11" fill="#FFF" stroke="#0E7490" stroke-width="2.2"/>
</g>
<text x="325" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#0E7490">Block 1</text>
<text x="325" y="376" text-anchor="middle" font-size="15" fill="#1F2937">Conv 3 → 32</text>
<text x="325" y="398" text-anchor="middle" font-size="14" fill="#64748B">+ BN + ReLU</text>
<text x="325" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#0E7490">MaxPool → /2</text>

<!-- Stack 1: 4 slabs (32 ch), height = 100px -->
<g transform="translate(425, 335)" stroke="#0E7490" stroke-width="1.4">
  <!-- 4 isometric slabs -->
  <g fill="#CFE3EA">
    <polygon points="0,20 35,5 70,20 35,35"/><polygon points="0,20 35,35 35,42 0,27" fill="#B4D2DC"/><polygon points="35,35 70,20 70,27 35,42" fill="#A6C8D4"/>
    <polygon points="0,40 35,25 70,40 35,55"/><polygon points="0,40 35,55 35,62 0,47" fill="#B4D2DC"/><polygon points="35,55 70,40 70,47 35,62" fill="#A6C8D4"/>
    <polygon points="0,60 35,45 70,60 35,75"/><polygon points="0,60 35,75 35,82 0,67" fill="#B4D2DC"/><polygon points="35,75 70,60 70,67 35,82" fill="#A6C8D4"/>
    <polygon points="0,80 35,65 70,80 35,95"/><polygon points="0,80 35,95 35,102 0,87" fill="#B4D2DC"/><polygon points="35,95 70,80 70,87 35,102" fill="#A6C8D4"/>
  </g>
</g>
<text x="460" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">32 ch</text>
<text x="460" y="496" text-anchor="middle" font-size="14" fill="#64748B">112 × 112</text>

<line x1="510" y1="385" x2="544" y2="385" stroke="#0E7490" stroke-width="2.6" marker-end="url(#arT)"/>

<!-- ================= STEP 3: BLOCK 2 (64 CH, SPATIAL 56) ================= -->
<g filter="url(#sh)">
  <rect x="555" y="320" width="170" height="130" rx="11" fill="#FFF" stroke="#0E7490" stroke-width="2.2"/>
</g>
<text x="640" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#0E7490">Block 2</text>
<text x="640" y="376" text-anchor="middle" font-size="15" fill="#1F2937">Conv 32 → 64</text>
<text x="640" y="398" text-anchor="middle" font-size="14" fill="#64748B">+ BN + ReLU</text>
<text x="640" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#0E7490">MaxPool → /2</text>

<!-- Stack 2: 6 slabs (64 ch), height = 50px (50% reduction in spatial dimension) -->
<g transform="translate(740, 360)" stroke="#0E7490" stroke-width="1.4">
  <g fill="#B4D2DC">
    <polygon points="0,10 24,2 48,10 24,18"/><polygon points="0,10 24,18 24,22 0,14" fill="#9AC2D0"/><polygon points="24,18 48,10 48,14 24,22" fill="#88B4C4"/>
    <polygon points="0,18 24,10 48,18 24,26"/><polygon points="0,18 24,26 24,30 0,22" fill="#9AC2D0"/><polygon points="24,26 48,18 48,22 24,30" fill="#88B4C4"/>
    <polygon points="0,26 24,18 48,26 24,34"/><polygon points="0,26 24,34 24,38 0,30" fill="#9AC2D0"/><polygon points="24,34 48,26 48,30 24,38" fill="#88B4C4"/>
    <polygon points="0,34 24,26 48,34 24,42"/><polygon points="0,34 24,42 24,46 0,38" fill="#9AC2D0"/><polygon points="24,42 48,34 48,38 24,46" fill="#88B4C4"/>
    <polygon points="0,42 24,34 48,42 24,50"/><polygon points="0,42 24,50 24,54 0,46" fill="#9AC2D0"/><polygon points="24,50 48,42 48,46 24,54" fill="#88B4C4"/>
    <polygon points="0,50 24,42 48,50 24,58"/><polygon points="0,50 24,58 24,62 0,54" fill="#9AC2D0"/><polygon points="24,58 48,50 48,54 24,62" fill="#88B4C4"/>
  </g>
</g>
<text x="764" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">64 ch</text>
<text x="764" y="496" text-anchor="middle" font-size="14" fill="#6B7280">56 × 56</text>

<line x1="804" y1="385" x2="838" y2="385" stroke="#0E7490" stroke-width="2.6" marker-end="url(#arT)"/>

<!-- ================= STEP 4: BLOCK 3 (128 CH, SPATIAL 28) ================= -->
<g filter="url(#sh)">
  <rect x="850" y="320" width="170" height="130" rx="11" fill="#FFF" stroke="#0E7490" stroke-width="2.2"/>
</g>
<text x="935" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#0E7490">Block 3</text>
<text x="935" y="376" text-anchor="middle" font-size="15" fill="#1F2937">Conv 64 → 128</text>
<text x="935" y="398" text-anchor="middle" font-size="14" fill="#64748B">+ BN + ReLU</text>
<text x="935" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#0E7490">MaxPool → /2</text>

<!-- Stack 3: 8 slabs (128 ch), height = 25px (50% reduction from step 2) -->
<g transform="translate(1035, 372)" stroke="#0E7490" stroke-width="1.2">
  <g fill="#9AC2D0">
    <polygon points="0,5 16,1 32,5 16,9"/><polygon points="0,5 16,9 16,12 0,8" fill="#88B4C4"/><polygon points="16,9 32,5 32,8 16,12" fill="#76A4B5"/>
    <polygon points="0,10 16,6 32,10 16,14"/><polygon points="0,10 16,14 16,17 0,13" fill="#88B4C4"/><polygon points="16,14 32,10 32,13 16,17" fill="#76A4B5"/>
    <polygon points="0,15 16,11 32,15 16,19"/><polygon points="0,15 16,19 16,22 0,18" fill="#88B4C4"/><polygon points="16,19 32,15 32,18 16,22" fill="#76A4B5"/>
    <polygon points="0,20 16,16 32,20 16,24"/><polygon points="0,20 16,24 16,27 0,23" fill="#88B4C4"/><polygon points="16,24 32,20 32,23 16,27" fill="#76A4B5"/>
    <polygon points="0,25 16,21 32,25 16,29"/><polygon points="0,25 16,29 16,32 0,28" fill="#88B4C4"/><polygon points="16,29 32,25 32,28 16,32" fill="#76A4B5"/>
    <polygon points="0,30 16,26 32,30 16,34"/><polygon points="0,30 16,34 16,37 0,33" fill="#88B4C4"/><polygon points="16,34 32,30 32,33 16,37" fill="#76A4B5"/>
    <polygon points="0,35 16,31 32,35 16,39"/><polygon points="0,35 16,39 16,42 0,38" fill="#88B4C4"/><polygon points="16,39 32,35 32,38 16,42" fill="#76A4B5"/>
    <polygon points="0,40 16,36 32,40 16,44"/><polygon points="0,40 16,44 16,47 0,43" fill="#88B4C4"/><polygon points="16,44 32,40 32,43 16,47" fill="#76A4B5"/>
  </g>
</g>
<text x="1051" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">128 ch</text>
<text x="1051" y="496" text-anchor="middle" font-size="14" fill="#6B7280">28 × 28</text>

<line x1="1082" y1="385" x2="1116" y2="385" stroke="#0E7490" stroke-width="2.6" marker-end="url(#arT)"/>

<!-- ================= STEP 5: SE-BLOCK (OPTIONAL) ================= -->
<g filter="url(#sh)">
  <rect x="1128" y="335" width="125" height="100" rx="10" fill="#FFF" stroke="#0E7490" stroke-width="2" stroke-dasharray="7 5"/>
</g>
<text x="1190" y="375" text-anchor="middle" font-size="16" font-weight="700" fill="#0E7490">SE-Block</text>
<text x="1190" y="400" text-anchor="middle" font-size="14" fill="#64748B">(ablation / tuỳ chọn)</text>

<line x1="1253" y1="385" x2="1284" y2="385" stroke="#0E7490" stroke-width="2.6" marker-end="url(#arT)"/>

<!-- ================= STEP 6: POOLING & NORM ================= -->
<g filter="url(#sh)">
  <rect x="1296" y="325" width="135" height="120" rx="10" fill="#FFF" stroke="#0E7490" stroke-width="2.2"/>
</g>
<text x="1363" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">AdaptiveAvgPool</text>
<text x="1363" y="385" text-anchor="middle" font-size="14" fill="#0E7490">→ [B,128,1,1]</text>
<text x="1363" y="412" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">+ LayerNorm</text>

<line x1="1431" y1="385" x2="1458" y2="385" stroke="#0E7490" stroke-width="2.6" marker-end="url(#arT)"/>

<!-- ================= STEP 7: OUTPUT VECTOR v_img ================= -->
<rect x="1470" y="340" width="90" height="90" rx="12" fill="#0E7490" filter="url(#sh)"/>
<text x="1515" y="382" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">v_img</text>
<text x="1515" y="408" text-anchor="middle" font-size="16" fill="#CFF0F7">[B,128]</text>

<!-- Vector visual strip below -->
<rect x="1440" y="450" width="140" height="24" fill="url(#vecCell)" stroke="#0B5E75" stroke-width="1.4"/>
<text x="1510" y="492" text-anchor="middle" font-size="13" fill="#64748B">128 chiều</text>

<!-- ================= PROPORTIONAL SCALE VERIFICATION GUIDES ================= -->
<g stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4" fill="none">
  <line x1="425" y1="437" x2="1070" y2="437"/>
</g>

<!-- ================= DETAILED METHODOLOGY SUMMARY BOX ================= -->
<rect x="50" y="555" width="1500" height="300" rx="14" fill="#FFF" stroke="#CBD5E1" stroke-width="2" filter="url(#sh)"/>
<text x="80" y="592" font-size="19" font-weight="700" fill="#0F172A">Chi tiết tham số &amp; Công thức tính toán qua các khối CustomCNN:</text>

<!-- Left Column: Layer specs table -->
<g font-size="15" fill="#334155">
  <text x="80" y="628" font-weight="700" fill="#0E7490">1. Đầu vào ảnh X-quang:</text>
  <text x="320" y="628">Kích thước chuẩn hoá: 224 × 224 × 3 kênh (RGB)</text>

  <text x="80" y="660" font-weight="700" fill="#0E7490">2. Khối Conv + BatchNorm + MaxPool 1:</text>
  <text x="420" y="660">Kernel 3×3, Stride 1, Padding 1 → Conv giữ 224×224×32 → MaxPool(2×2) → <tspan font-weight="700" fill="#0E7490">32 × 112 × 112</tspan></text>

  <text x="80" y="692" font-weight="700" fill="#0E7490">3. Khối Conv + BatchNorm + MaxPool 2:</text>
  <text x="420" y="692">Kernel 3×3, Stride 1, Padding 1 → Conv giữ 112×112×64 → MaxPool(2×2) → <tspan font-weight="700" fill="#0E7490">64 × 56 × 56</tspan></text>

  <text x="80" y="724" font-weight="700" fill="#0E7490">4. Khối Conv + BatchNorm + MaxPool 3:</text>
  <text x="420" y="724">Kernel 3×3, Stride 1, Padding 1 → Conv giữ 56×56×128 → MaxPool(2×2) → <tspan font-weight="700" fill="#0E7490">128 × 28 × 28</tspan></text>

  <text x="80" y="756" font-weight="700" fill="#0E7490">5. Khối Squeeze-and-Excitation (SE):</text>
  <text x="420" y="756">(Tuỳ chọn ablation) Tái trọng số theo kênh: F′ = s ⊙ F với s = σ( FC₂ ( ReLU ( FC₁ ( GAP(F) ) ) ) )</text>

  <text x="80" y="788" font-weight="700" fill="#0E7490">6. Nén không gian &amp; Chuẩn hoá:</text>
  <text x="420" y="788">AdaptiveAvgPool2d((1,1)) nén 28×28 về 1×1 → Flatten → LayerNorm(128) → thu được <tspan font-weight="700" fill="#0E7490">v_img ∈ ℝ¹²⁸</tspan></text>
</g>

<!-- Summary note box right bottom -->
<rect x="1060" y="805" width="460" height="38" rx="8" fill="#E7F2F5" stroke="#0E7490" stroke-width="1.6"/>
<text x="1290" y="829" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">Độ dài v_img = 128 chiều — hoàn toàn khớp với ResNet-18 head</text>

</svg>
