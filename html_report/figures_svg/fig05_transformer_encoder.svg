  <path d="M1184,390 v320 M1248,390 v320 M1312,390 v320 M1376,390 v320"/>
  <path d="M1120,454 h320 M1120,518 h320 M1120,582 h320 M1120,646 h320"/>
</g>
<rect x="1120" y="390" width="320" height="320" fill="none" stroke="#92400E" stroke-width="2"/>
<rect x="1246" y="580" width="68" height="68" fill="none" stroke="#15803D" stroke-width="3.4"/>
<line x1="1316" y1="614" x2="1450" y2="614" stroke="#15803D" stroke-width="1.8"/>
<text x="1456" y="609" font-size="14" font-weight="700" fill="#15803D">0.55</text>
<text x="1456" y="628" font-size="13" fill="#15803D">cao nhất</text>
<text x="1280" y="742" text-anchor="middle" font-size="16" fill="#1F2937">Mọi token attend tới mọi token, song song.</text>
<text x="1280" y="766" text-anchor="middle" font-size="16" fill="#15803D">“effusion” dồn trọng số vào “pleural” — quan hệ chéo, không phải đường chéo.</text>
<text x="1280" y="792" text-anchor="middle" font-size="14" fill="#6B7280">mỗi hàng cộng lại bằng 1</text>
</svg>
