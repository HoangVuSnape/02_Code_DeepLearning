<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<!-- Hình ⑤: Transformer Encoder. Sửa so với bản Gemini:
     - HEATMAP: ô đậm nhất tại (effusion, pleural), đường chéo chỉ ở mức trung bình
       (bản cũ đậm nhất trên đường chéo → minh hoạ "token chỉ attend vào chính nó" = vô nghĩa)
     - ⊕ đặt tại ĐIỂM HỢP NHẤT; điểm rẽ là chấm tròn đặc (bản cũ đặt ⊕ ở điểm rẽ)
     - không đếm phép cộng 2 lần: dùng ⊕ rồi hộp "LayerNorm" (bản cũ có cả ⊕ lẫn "Add & Norm")
     - bỏ nhãn "x2" trùng lặp; không ngắt từ "Transformer-EncoderLayer"
     - nhãn cột heatmap cùng một hướng; callout không cắt qua heatmap
     - panel zoom chạy TRÁI→PHẢI, cùng hướng đọc với luồng chính
-->
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="900" fill="#F6F8FB"/>

<!-- ===== MAIN FLOW ===== -->
<g filter="url(#sh)">
  <rect x="40" y="112" width="150" height="76" rx="10" fill="#FFF" stroke="#B45309" stroke-width="2"/>
  <rect x="216" y="106" width="212" height="88" rx="10" fill="#FFF" stroke="#B45309" stroke-width="2"/>
  <rect x="466" y="98" width="248" height="104" rx="10" fill="#F3F4F6" stroke="#B45309" stroke-width="2"/>
  <rect x="456" y="106" width="248" height="104" rx="10" fill="#FFF" stroke="#B45309" stroke-width="2.4"/>
  <rect x="782" y="88" width="222" height="60" rx="10" fill="#FFF" stroke="#B45309" stroke-width="2"/>
  <rect x="782" y="166" width="222" height="60" rx="10" fill="#FFF" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="1060" y="118" width="132" height="76" rx="10" fill="#FFF" stroke="#B45309" stroke-width="2"/>
  <rect x="1248" y="118" width="126" height="76" rx="10" fill="#B45309"/>
</g>
<text x="115" y="142" text-anchor="middle" font-size="16" fill="#1F2937">Question</text>
<text x="115" y="166" text-anchor="middle" font-size="16" fill="#1F2937">tokens [B,32]</text>
<text x="322" y="136" text-anchor="middle" font-size="16" fill="#1F2937">Embedding</text>
<text x="322" y="158" text-anchor="middle" font-size="16" fill="#1F2937">+ Positional Encoding</text>
<text x="322" y="182" text-anchor="middle" font-size="15" fill="#B45309">→ [B,32,64]</text>
<text x="580" y="140" text-anchor="middle" font-size="17" font-weight="600" fill="#1F2937">2 × TransformerEncoderLayer</text>
<text x="580" y="166" text-anchor="middle" font-size="15" fill="#6B7280">d = 64 · heads = 4</text>
<text x="580" y="188" text-anchor="middle" font-size="15" fill="#6B7280">ff = 128 · dropout = 0.1</text>
<text x="893" y="124" text-anchor="middle" font-size="16" fill="#1F2937">masked-mean pooling</text>
<text x="893" y="196" text-anchor="middle" font-size="16" fill="#1F2937">attention pooling</text>
<text x="893" y="216" text-anchor="middle" font-size="13" fill="#6B7280">ablation</text>
<text x="1126" y="162" text-anchor="middle" font-size="17" fill="#1F2937">LayerNorm</text>
<text x="1311" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF">v_txt</text>
<text x="1311" y="172" text-anchor="middle" font-size="17" fill="#FDE9CE">[B,64]</text>

<g stroke="#2563EB" stroke-width="2.4" marker-end="url(#a)">
  <line x1="192" y1="150" x2="212" y2="150"/><line x1="430" y1="150" x2="452" y2="150"/>
  <path d="M708,158 L744,158 L744,118 L778,118" fill="none"/>
  <path d="M708,158 L744,158 L744,196 L778,196" fill="none"/>
  <path d="M1006,118 L1036,118 L1036,156 L1056,156" fill="none"/>
  <path d="M1006,196 L1036,196 L1036,156" fill="none"/>
  <line x1="1194" y1="156" x2="1244" y2="156"/>
</g>
<text x="744" y="148" text-anchor="middle" font-size="14" fill="#6B7280">[B,32,64]</text>

<!-- ===== ZOOM CALLOUT : one encoder layer, left→right ===== -->
<g stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="7 5" fill="none">
  <path d="M470,212 L120,296"/><path d="M600,212 L900,296"/>
</g>
<rect x="60" y="300" width="900" height="330" rx="14" fill="#FFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="510" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">Bên trong MỘT TransformerEncoderLayer (post-LayerNorm)</text>

<circle cx="98" cy="490" r="7" fill="#334155"/>
<text x="98" y="524" text-anchor="middle" font-size="15" fill="#475569">x</text>
<g filter="url(#sh)">
  <rect x="132" y="452" width="172" height="76" rx="9" fill="#FFF" stroke="#B45309" stroke-width="2"/>
  <rect x="366" y="460" width="106" height="60" rx="9" fill="#FFF" stroke="#B45309" stroke-width="2"/>
  <rect x="510" y="452" width="172" height="76" rx="9" fill="#FFF" stroke="#B45309" stroke-width="2"/>
  <rect x="744" y="460" width="106" height="60" rx="9" fill="#FFF" stroke="#B45309" stroke-width="2"/>
</g>
<text x="218" y="482" text-anchor="middle" font-size="15" fill="#1F2937">Multi-Head</text>
<text x="218" y="503" text-anchor="middle" font-size="15" fill="#1F2937">Self-Attention</text>
<text x="218" y="521" text-anchor="middle" font-size="13" fill="#6B7280">4 heads</text>
<text x="419" y="496" text-anchor="middle" font-size="15" fill="#1F2937">LayerNorm</text>
<text x="596" y="484" text-anchor="middle" font-size="15" fill="#1F2937">Feed-Forward</text>
<text x="596" y="506" text-anchor="middle" font-size="15" fill="#1F2937">64 → 128 → 64</text>
<text x="797" y="496" text-anchor="middle" font-size="15" fill="#1F2937">LayerNorm</text>

<!-- merge points -->
<circle cx="336" cy="490" r="17" fill="#FFF" stroke="#334155" stroke-width="2.2"/>
<line x1="326" y1="490" x2="346" y2="490" stroke="#334155" stroke-width="2.2"/>
<line x1="336" y1="480" x2="336" y2="500" stroke="#334155" stroke-width="2.2"/>
<circle cx="714" cy="490" r="17" fill="#FFF" stroke="#334155" stroke-width="2.2"/>
<line x1="704" y1="490" x2="724" y2="490" stroke="#334155" stroke-width="2.2"/>
<line x1="714" y1="480" x2="714" y2="500" stroke="#334155" stroke-width="2.2"/>
<!-- branch point -->
<circle cx="492" cy="490" r="7" fill="#334155"/>

<g stroke="#334155" stroke-width="2.2" marker-end="url(#a)" fill="none">
  <line x1="106" y1="490" x2="128" y2="490" stroke="#2563EB"/>
  <line x1="306" y1="490" x2="315" y2="490" stroke="#2563EB"/>
  <line x1="355" y1="490" x2="362" y2="490" stroke="#2563EB"/>
  <line x1="474" y1="490" x2="486" y2="490" stroke="#2563EB"/>
  <line x1="498" y1="490" x2="506" y2="490" stroke="#2563EB"/>
  <line x1="684" y1="490" x2="693" y2="490" stroke="#2563EB"/>
  <line x1="733" y1="490" x2="740" y2="490" stroke="#2563EB"/>
  <line x1="852" y1="490" x2="896" y2="490" stroke="#2563EB"/>
</g>
<text x="922" y="496" text-anchor="middle" font-size="15" fill="#475569">y</text>
<path d="M98,482 C98,410 336,410 336,469" fill="none" stroke="#B45309" stroke-width="2.4" marker-end="url(#aA)"/>
<path d="M492,482 C492,410 714,410 714,469" fill="none" stroke="#B45309" stroke-width="2.4" marker-end="url(#aA)"/>
<text x="217" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#B45309">residual</text>
<text x="603" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#B45309">residual</text>
<text x="510" y="586" text-anchor="middle" font-size="15" fill="#6B7280">⊕ chỉ xuất hiện ở nơi HỢP NHẤT · chấm tròn đặc là nơi RẼ NHÁNH</text>
<text x="510" y="610" text-anchor="middle" font-size="15" fill="#6B7280">hộp chỉ ghi “LayerNorm” vì phép cộng đã do ⊕ đảm nhiệm — không đếm hai lần</text>

<!-- ===== ATTENTION HEATMAP ===== -->
<text x="1280" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">Ma trận attention (hàng = query, cột = key)</text>
<g font-size="13" fill="#475569" text-anchor="middle">
  <text x="1152" y="378">is</text><text x="1216" y="378">there</text><text x="1280" y="378">pleural</text>
  <text x="1344" y="378">effusion</text><text x="1408" y="378">?</text>
