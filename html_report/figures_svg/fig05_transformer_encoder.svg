  <rect x="1120" y="518" width="64" height="64" fill-opacity=".18"/><rect x="1184" y="518" width="64" height="64" fill-opacity=".27"/><rect x="1248" y="518" width="64" height="64" fill-opacity=".55"/><rect x="1312" y="518" width="64" height="64" fill-opacity=".64"/><rect x="1376" y="518" width="64" height="64" fill-opacity=".18"/>
  <rect x="1120" y="582" width="64" height="64" fill-opacity=".15"/><rect x="1184" y="582" width="64" height="64" fill-opacity=".18"/><rect x="1248" y="582" width="64" height="64" fill-opacity="1"/><rect x="1312" y="582" width="64" height="64" fill-opacity=".31"/><rect x="1376" y="582" width="64" height="64" fill-opacity=".18"/>
  <rect x="1120" y="646" width="64" height="64" fill-opacity=".22"/><rect x="1184" y="646" width="64" height="64" fill-opacity=".22"/><rect x="1248" y="646" width="64" height="64" fill-opacity=".51"/><rect x="1312" y="646" width="64" height="64" fill-opacity=".60"/><rect x="1376" y="646" width="64" height="64" fill-opacity=".27"/>
</g>
