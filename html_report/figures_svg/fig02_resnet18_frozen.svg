<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<!-- Hình ②: ResNet-18 đóng băng. Sửa so với bản Gemini:
     - layer1→layer2→layer3→layer4 nối tiếp bằng mũi tên (bản cũ 4 hộp rời)
     - residual vẽ ĐÚNG vị trí: bên trong 1 BasicBlock (callout), không bắc cầu layer1→layer4
     - mũi tên gradient xuất phát từ head trainable và bị chặn TẠI BIÊN container
     - bỏ chữ rác "STRUCK THROUGH" / "HOT" / "ACTIVE"; mọi nhãn nằm ngang
     - icon vẽ bằng path, không dùng emoji
     THAY ẢNH X-QUANG: đổi <g id="xray"> bằng <image href="..." x="50" y="380" width="150" height="150"/>
-->
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker>
  <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>

<rect width="1600" height="980" fill="#F6F8FB"/>

<!-- ============ INPUT ============ -->
<g id="xray">
  <rect x="50" y="380" width="150" height="150" rx="6" fill="#22303C" stroke="#0E7490" stroke-width="2"/>
  <ellipse cx="88" cy="455" rx="26" ry="44" fill="#41545F"/>
  <ellipse cx="162" cy="455" rx="26" ry="44" fill="#41545F"/>
  <rect x="122" y="405" width="6" height="105" rx="3" fill="#8FA3AD"/>
  <g stroke="#8FA3AD" stroke-width="1.6" fill="none" opacity=".75">
    <path d="M62,428 Q88,418 118,424"/><path d="M62,452 Q88,442 118,448"/><path d="M62,476 Q88,466 118,472"/>
    <path d="M132,424 Q162,418 188,428"/><path d="M132,448 Q162,442 188,452"/><path d="M132,472 Q162,466 188,476"/>
  </g>
</g>
<text x="125" y="558" text-anchor="middle" font-size="19" fill="#1F2937">Image [B,3,224,224]</text>
<text x="125" y="582" text-anchor="middle" font-size="15" fill="#6B7280">ImageNet normalization</text>
<line x1="212" y1="455" x2="258" y2="455" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ar)"/>

<!-- ============ FROZEN BACKBONE ============ -->
<rect x="270" y="190" width="620" height="430" rx="16" fill="#E3EDF4" stroke="#7C9CB4" stroke-width="2.5" stroke-dasharray="9 6"/>
<!-- frost corners -->
<g stroke="#B9D2E2" stroke-width="2" opacity=".9">
  <path d="M286,206 l0,26 M273,219 l26,0 M277,210 l18,18 M295,210 l-18,18"/>
  <path d="M874,206 l0,26 M861,219 l26,0 M865,210 l18,18 M883,210 l-18,18"/>
</g>
<!-- padlock icon -->
<g transform="translate(300,232)">
  <rect x="0" y="12" width="26" height="20" rx="4" fill="#42678A"/>
  <path d="M6,12 v-6 a7,7 0 0 1 14,0 v6" fill="none" stroke="#42678A" stroke-width="3.4"/>
</g>
<text x="580" y="250" text-anchor="middle" font-size="23" font-weight="600" fill="#1F2937">ResNet-18 backbone (pretrained)</text>
<text x="580" y="282" text-anchor="middle" font-size="19" font-weight="600" fill="#42678A" letter-spacing=".5">FROZEN — no gradient update</text>

<g font-size="20" fill="#1F2937" text-anchor="middle">
  <rect x="300" y="330" width="125" height="82" rx="10" fill="#FFFFFF" stroke="#7C9CB4" stroke-width="2"/><text x="362" y="378">layer1</text>
  <rect x="445" y="330" width="125" height="82" rx="10" fill="#FFFFFF" stroke="#7C9CB4" stroke-width="2"/><text x="507" y="378">layer2</text>
  <rect x="590" y="330" width="125" height="82" rx="10" fill="#FFFFFF" stroke="#7C9CB4" stroke-width="2"/><text x="652" y="378">layer3</text>
  <rect x="735" y="330" width="125" height="82" rx="10" fill="#FFFFFF" stroke="#7C9CB4" stroke-width="2"/><text x="797" y="378">layer4</text>
</g>
<g stroke="#64748B" stroke-width="2.4" marker-end="url(#arG)">
  <line x1="425" y1="371" x2="441" y2="371"/><line x1="570" y1="371" x2="586" y2="371"/><line x1="715" y1="371" x2="731" y2="371"/>
</g>
<text x="580" y="444" text-anchor="middle" font-size="17" fill="#6B7280">mỗi layer = 2 × BasicBlock (xem chi tiết bên dưới)</text>
<rect x="470" y="472" width="220" height="38" rx="8" fill="#0E7490"/>
<text x="580" y="498" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">[B,512,7,7]</text>

<line x1="890" y1="371" x2="916" y2="371" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ar)"/>

<!-- ============ HEAD ============ -->
<rect x="920" y="330" width="120" height="82" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="980" y="365" text-anchor="middle" font-size="18" fill="#1F2937">SE-Block</text>
<text x="980" y="389" text-anchor="middle" font-size="15" fill="#6B7280">(optional)</text>
<line x1="1040" y1="371" x2="1066" y2="371" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ar)"/>

<rect x="1070" y="330" width="160" height="82" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="2" filter="url(#sh)"/>
<text x="1150" y="365" text-anchor="middle" font-size="18" fill="#1F2937">AdaptiveAvgPool</text>
<text x="1150" y="390" text-anchor="middle" font-size="17" fill="#0E7490">→ [B,512]</text>
<line x1="1230" y1="371" x2="1256" y2="371" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ar)"/>

<rect x="1260" y="316" width="200" height="110" rx="12" fill="#E8F6EC" stroke="#15803D" stroke-width="3.5" filter="url(#sh)"/>
<text x="1360" y="352" text-anchor="middle" font-size="18" fill="#14532D">Linear(512 → 128)</text>
<text x="1360" y="378" text-anchor="middle" font-size="18" fill="#14532D">+ LayerNorm</text>
<text x="1360" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#15803D">TRAINABLE</text>
<text x="1290" y="452" text-anchor="middle" font-size="16" fill="#15803D">chỉ phần này được cập nhật</text>

<rect x="1300" y="200" width="130" height="62" rx="10" fill="#0E7490"/>
<text x="1365" y="226" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">v_img</text>
<text x="1365" y="250" text-anchor="middle" font-size="18" fill="#CFF0F7">[B,128]</text>
<path d="M1360,314 L1360,268" fill="none" stroke="#0E7490" stroke-width="2.8" marker-end="url(#arT)"/>

<!-- ============ GRADIENT BLOCKED AT BOUNDARY ============ -->
<path d="M1445,432 L1445,560 L916,560" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arR)"/>
<rect x="884" y="522" width="14" height="76" rx="4" fill="#DC2626"/>
<g stroke="#DC2626" stroke-width="6" stroke-linecap="round">
  <line x1="922" y1="542" x2="954" y2="578"/><line x1="954" y1="542" x2="922" y2="578"/>
</g>
<text x="1180" y="600" text-anchor="middle" font-size="18" font-weight="600" fill="#DC2626">∂L/∂θ dừng tại biên — trọng số backbone không đổi</text>

<!-- ============ BASIC BLOCK CALLOUT ============ -->
<g stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="7 5" fill="none">
  <path d="M470,412 L330,668"/><path d="M545,412 L860,668"/>
</g>
<rect x="270" y="668" width="620" height="282" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="580" y="702" text-anchor="middle" font-size="19" font-weight="600" fill="#475569">Phóng to 1 BasicBlock — residual nằm BÊN TRONG block</text>

<circle cx="322" cy="820" r="6" fill="#334155"/>
<text x="322" y="866" text-anchor="middle" font-size="17" fill="#475569">x</text>
<g font-size="16" fill="#1F2937" text-anchor="middle">
  <rect x="368" y="788" width="150" height="66" rx="9" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="443" y="815">conv 3×3 + BN</text><text x="443" y="838">+ ReLU</text>
  <rect x="558" y="788" width="150" height="66" rx="9" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="633" y="815">conv 3×3 + BN</text><text x="633" y="838">(no ReLU)</text>
</g>
<g stroke="#64748B" stroke-width="2.4" marker-end="url(#arG)">
  <line x1="328" y1="820" x2="364" y2="820"/><line x1="518" y1="820" x2="554" y2="820"/><line x1="708" y1="820" x2="748" y2="820"/>
</g>
<circle cx="768" cy="820" r="21" fill="#FFFFFF" stroke="#334155" stroke-width="2.4"/>
<line x1="756" y1="820" x2="780" y2="820" stroke="#334155" stroke-width="2.4"/>
<line x1="768" y1="808" x2="768" y2="832" stroke="#334155" stroke-width="2.4"/>
<path d="M322,814 C322,742 700,742 768,742 L768,795" fill="none" stroke="#0E7490" stroke-width="2.6" marker-end="url(#arT)"/>
<text x="545" y="734" text-anchor="middle" font-size="17" font-weight="600" fill="#0E7490">identity (skip connection)</text>
<line x1="789" y1="820" x2="828" y2="820" stroke="#64748B" stroke-width="2.4" marker-end="url(#arG)"/>
<text x="852" y="826" text-anchor="middle" font-size="17" fill="#1F2937">ReLU</text>
<text x="580" y="906" text-anchor="middle" font-size="16" fill="#6B7280">y = ReLU( x + F(x) ) — điểm ⊕ là nơi HỢP NHẤT, không phải nơi rẽ nhánh</text>
</svg>
